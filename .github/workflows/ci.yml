name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # wreq builds BoringSSL: cmake and libclang are preinstalled on all
      # three runners; Windows also needs NASM for the assembly sources.
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      # Without default features too, so the lean build stays honest.
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features
      # The browser tests skip without Chromium; give Linux one so they run.
      - if: runner.os == 'Linux'
        run: cargo run -q -p mc-cli --features browser -- browsers install
      - run: cargo test --workspace --all-features
