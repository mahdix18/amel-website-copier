name: Release

# Pushing a tag such as v0.2.0 builds packages for Linux, macOS and Windows
# with scripts/package.sh and publishes them, with checksums, as a GitHub
# release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The version comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Package
        shell: bash
        run: |
          scripts/package.sh
          FEATURES=browser scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
