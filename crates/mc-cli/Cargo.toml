[package]
name = "mc-cli"
description = "The `mistercopy` command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "mistercopy"
path = "src/main.rs"

[features]
# Chromium via Playwright: `--requester playwright` and `auto`. Its build
# fetches the Playwright driver, so it is opt-in.
browser = ["dep:mc-requester-playwright"]

[dependencies]
axum.workspace = true
clap.workspace = true
indicatif.workspace = true
mc-core.workspace = true
mc-requester.workspace = true
mc-requester-playwright = { workspace = true, optional = true }
mc-requester-wreq.workspace = true
mc-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
zip.workspace = true

[dev-dependencies]
flate2.workspace = true
mc-extract.workspace = true
mc-fixtures.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
